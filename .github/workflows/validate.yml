name: Validate physics skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill structure
        run: python scripts/validate_repo.py
      - name: Compile helper scripts
        run: python -m py_compile scripts/*.py
      - name: Validate evaluation JSON
        run: python -m json.tool evals/routing-cases.json > /dev/null
