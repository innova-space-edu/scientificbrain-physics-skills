[project]
name = "scientificbrain-physics-skills"
version = "0.3.0"
description = "Composable physics agent skills for model routing, plasma simulation, transport, validation, uncertainty, scientific ML and reproducible workflows"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Innova Space Edu SpA"}]

[project.optional-dependencies]
analysis = ["numpy>=1.24", "h5py>=3.8", "yt>=4.2"]

[tool.scientificbrain]
skill_format = "modular-agent-skills"
architecture_inspiration = ["NVIDIA Agent Skills", "Google DeepMind Science Skills"]
evaluation_levels = ["unit", "workflow", "capability"]
flash_source_bundled = false
external_solver_binaries_bundled = false
canonical_data = "openPMD/native+adapters"
